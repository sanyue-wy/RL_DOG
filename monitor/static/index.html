<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12-DOF 四足机器人训练监控系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding: 16px;
            background: #1e293b;
            border-radius: 12px;
        }
        h1 { font-size: 24px; color: #f8fafc; }
        .subtitle { font-size: 14px; color: #94a3b8; margin-top: 4px; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            display: inline-block; margin-right: 8px;
        }
        .status-dot.online { background: #22c55e; }
        .status-dot.offline { background: #ef4444; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-green { background: #16a34a; color: white; }
        .btn-green:hover:not(:disabled) { background: #15803d; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-blue:hover:not(:disabled) { background: #1d4ed8; }
        .btn-outline { background: transparent; border: 1px solid #475569; color: #e2e8f0; }
        .btn-outline:hover:not(:disabled) { background: #334155; }
        .btn-red { background: #dc2626; color: white; }
        .btn-red:hover:not(:disabled) { background: #b91c1c; }
        .status-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .status-row:last-child { border-bottom: none; }
        .status-label { color: #94a3b8; }
        .status-value { font-weight: 500; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #334155;
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #84cc16);
            transition: width 0.3s;
        }
        .metric-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .metric-icon {
            width: 40px; height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .metric-label { font-size: 12px; color: #94a3b8; }
        .metric-value { font-size: 24px; font-weight: 700; }
        .loss-item { margin-bottom: 12px; }
        .loss-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .loss-label { color: #94a3b8; }
        .loss-bar {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }
        .loss-fill { height: 100%; border-radius: 3px; }
        .chart-container {
            background: #0f172a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .chart-title { font-size: 14px; color: #94a3b8; margin-bottom: 12px; }
        canvas { width: 100% !important; }
        .reward-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .reward-name {
            width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #94a3b8;
        }
        .reward-bar-container {
            flex: 1;
            height: 16px;
            background: #334155;
            border-radius: 8px;
            overflow: hidden;
        }
        .reward-bar { height: 100%; border-radius: 8px; }
        .reward-value {
            width: 70px;
            text-align: right;
            font-family: monospace;
        }
        .log-container {
            background: #0f172a;
            border-radius: 8px;
            padding: 12px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        .log-line { padding: 2px 0; }
        .log-line.error { color: #ef4444; }
        .log-line.reward { color: #22c55e; }
        .log-line.iteration { color: #3b82f6; font-weight: 600; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse { animation: pulse 2s infinite; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script>
        // 状态管理
        const state = {
            connected: false,
            status: { running: false, paused: false, render_mode: false, current_iteration: 0, total_iterations: 100000 },
            metrics: { mean_reward: [], mean_episode_length: [], value_loss: [], surrogate_loss: [], estimation_loss: [], swap_loss: [] },
            rewards: {},
            currentMetrics: {},
            logs: []
        };

        // Socket.IO 连接
        let socket;
        try {
            socket = io(window.location.origin, { path: '/socket.io', transports: ['websocket', 'polling'] });
            socket.on('connect', () => { state.connected = true; render(); });
            socket.on('disconnect', () => { state.connected = false; render(); });
            socket.on('train_status', (data) => { Object.assign(state.status, data); render(); });
            socket.on('iteration_update', (data) => {
                state.status.current_iteration = data.current;
                state.status.total_iterations = data.total;
                render();
            });
            socket.on('metrics_update', (data) => {
                Object.assign(state.currentMetrics, data);
                Object.keys(data).forEach(key => {
                    if (state.metrics[key]) state.metrics[key] = [...state.metrics[key].slice(-49), data[key]];
                });
                Object.keys(data).forEach(key => {
                    if (key.startsWith('rew_')) {
                        const name = key.replace('rew_', '');
                        if (!state.rewards[name]) state.rewards[name] = [];
                        state.rewards[name] = [...state.rewards[name].slice(-49), data[key]];
                    }
                });
                render();
            });
            socket.on('train_output', (data) => {
                state.logs = [...state.logs.slice(-99), data.data];
                render();
            });
        } catch(e) {
            console.error('Socket connection failed:', e);
        }

        // 发送命令
        function startTraining(render_mode) {
            if (socket) socket.emit('start_training', { render: render_mode });
        }
        function stopTraining() {
            if (socket) socket.emit('stop_training');
        }
        function pauseTraining() {
            if (socket) socket.emit('pause_training');
        }

        // 渲染函数
        function render() {
            const app = document.getElementById('app');
            const { connected, status, currentMetrics, rewards, logs } = state;
            const progress = (status.current_iteration / status.total_iterations * 100).toFixed(1);

            // 准备奖励数据
            const rewardItems = Object.keys(rewards).map(name => ({
                name,
                value: currentMetrics[`rew_${name}`] || 0
            })).sort((a, b) => Math.abs(b.value) - Math.abs(a.value)).slice(0, 15);

            app.innerHTML = `
                <header>
                    <div>
                        <h1>🐕 12-DOF 四足机器人训练监控系统</h1>
                        <div class="subtitle">基于 Isaac Gym + HIM-PPO 的强化学习训练</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span class="status-dot ${connected ? 'online' : 'offline'}"></span>
                        <span style="font-size:14px;color:#94a3b8">${connected ? '已连接' : '未连接'}</span>
                    </div>
                </header>

                <div class="grid">
                    <div>
                        <!-- 训练控制 -->
                        <div class="card">
                            <div class="card-title">🎮 训练控制</div>
                            <div class="btn-group">
                                <button class="btn btn-green" onclick="startTraining(true)" ${status.running ? 'disabled' : ''}>
                                    👁️ 开启渲染
                                </button>
                                <button class="btn btn-blue" onclick="startTraining(false)" ${status.running ? 'disabled' : ''}>
                                    🔇 关闭渲染
                                </button>
                                <button class="btn btn-outline" onclick="pauseTraining()" ${!status.running ? 'disabled' : ''}>
                                    ${status.paused ? '▶️ 恢复' : '⏸️ 暂停'}
                                </button>
                                <button class="btn btn-red" onclick="stopTraining()" ${!status.running ? 'disabled' : ''}>
                                    ⏹️ 停止
                                </button>
                            </div>
                            <div>
                                <div class="status-row">
                                    <span class="status-label">状态</span>
                                    <span class="status-value" style="color:${status.running ? '#22c55e' : '#94a3b8'}">
                                        ${status.running ? (status.paused ? '⏸ 已暂停' : '● 训练中') : '○ 已停止'}
                                    </span>
                                </div>
                                <div class="status-row">
                                    <span class="status-label">渲染</span>
                                    <span class="status-value">${status.render_mode ? '开启' : '关闭'}</span>
                                </div>
                                <div class="status-row">
                                    <span class="status-label">迭代</span>
                                    <span class="status-value" style="font-family:monospace">
                                        ${status.current_iteration.toLocaleString()} / ${status.total_iterations.toLocaleString()}
                                    </span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width:${progress}%"></div>
                                </div>
                            </div>
                        </div>

                        <!-- 核心指标 -->
                        <div class="card">
                            <div class="card-title">📊 核心指标</div>
                            <div class="metric-card">
                                <div class="metric-icon" style="background:#166534;color:#22c55e">📈</div>
                                <div>
                                    <div class="metric-label">Mean Reward</div>
                                    <div class="metric-value" style="color:#22c55e">${currentMetrics.mean_reward?.toFixed(2) || '--'}</div>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-icon" style="background:#1e3a5f;color:#3b82f6">⏱️</div>
                                <div>
                                    <div class="metric-label">Episode Length</div>
                                    <div class="metric-value" style="color:#3b82f6">${currentMetrics.mean_episode_length?.toFixed(0) || '--'}</div>
                                </div>
                            </div>
                            <div class="metric-card">
                                <div class="metric-icon" style="background:#581c87;color:#a855f7">🎲</div>
                                <div>
                                    <div class="metric-label">Action Noise</div>
                                    <div class="metric-value" style="color:#a855f7">${currentMetrics.action_noise_std?.toFixed(2) || '--'}</div>
                                </div>
                            </div>
                        </div>

                        <!-- 损失函数 -->
                        <div class="card">
                            <div class="card-title">📉 损失函数</div>
                            ${['value_loss|Value Loss|#f97316', 'surrogate_loss|Surrogate Loss|#3b82f6',
                               'estimation_loss|Estimation Loss|#a855f7', 'swap_loss|Swap Loss|#ec4899']
                               .map(item => {
                                   const [key, label, color] = item.split('|');
                                   const val = currentMetrics[key]?.toFixed(4) || '--';
                                   const width = Math.min(100, (parseFloat(currentMetrics[key]) || 0) * 20);
                                   return `<div class="loss-item">
                                       <div class="loss-header">
                                           <span class="loss-label">${label}</span>
                                           <span style="font-family:monospace">${val}</span>
                                       </div>
                                       <div class="loss-bar">
                                           <div class="loss-fill" style="width:${width}%;background:${color}"></div>
                                       </div>
                                   </div>`;
                               }).join('')}
                        </div>
                    </div>

                    <div>
                        <!-- 奖励分解 -->
                        <div class="card">
                            <div class="card-title">🏆 奖励项分解</div>
                            ${rewardItems.length === 0 ?
                                '<div class="empty-state">等待训练数据...</div>' :
                                rewardItems.map(r => {
                                    const isPos = r.value >= 0;
                                    const width = Math.min(100, Math.abs(r.value) * 100);
                                    return `<div class="reward-item">
                                        <div class="reward-name" title="${r.name}">${r.name}</div>
                                        <div class="reward-bar-container">
                                            <div class="reward-bar" style="width:${width}%;background:${isPos ? '#22c55e' : '#ef4444'}"></div>
                                        </div>
                                        <div class="reward-value" style="color:${isPos ? '#22c55e' : '#ef4444'}">
                                            ${r.value >= 0 ? '+' : ''}${r.value.toFixed(3)}
                                        </div>
                                    </div>`;
                                }).join('')}
                        </div>

                        <!-- 训练日志 -->
                        <div class="card">
                            <div class="card-title">📋 训练日志 <span style="font-size:12px;color:#64748b;margin-left:auto">${logs.length} 条</span></div>
                            <div class="log-container" id="logContainer">
                                ${logs.length === 0 ?
                                    '<div class="empty-state">等待训练输出...</div>' :
                                    logs.map(log => {
                                        let cls = '';
                                        if (log.includes('Error')) cls = 'error';
                                        else if (log.includes('Mean reward')) cls = 'reward';
                                        else if (log.includes('Learning iteration')) cls = 'iteration';
                                        return `<div class="log-line ${cls}">${log}</div>`;
                                    }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 自动滚动日志
            const logContainer = document.getElementById('logContainer');
            if (logContainer) logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 初始渲染
        render();
    </script>
</body>
</html>
